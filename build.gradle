plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.8.10'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// 安全地读取属性，避免 MinecraftDev 插件解析错误
def getModProperty(String name, String defaultValue = '') {
    return project.findProperty(name) ?: defaultValue
}

version = getModProperty('mod_version', '1.0.0')
group = getModProperty('mod_group_id', 'com.lanye.dolladdon')

repositories {
    // 使用国内镜像加速依赖下载
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven { url 'https://maven.aliyun.com/repository/google' }
    // NeoForge 官方仓库（必须保留）
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    // Modrinth Maven 仓库
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    // Maven Central 作为备用
    mavenCentral()
    // 本地Maven仓库
    mavenLocal()
}

base {
    archivesName = getModProperty('mod_id', 'player_doll')
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = getModProperty('neo_version', '21.1.217')

    parchment {
        mappingsVersion = getModProperty('parchment_mappings_version', '2024.11.17')
        minecraftVersion = getModProperty('parchment_minecraft_version', '1.21.1')
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', getModProperty('mod_id', 'player_doll')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', getModProperty('mod_id', 'player_doll')
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', getModProperty('mod_id', 'player_doll')
        }

        data {
            data()
            programArguments.addAll '--mod', getModProperty('mod_id', 'player_doll'), '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${getModProperty('mod_id', 'player_doll')}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 不再依赖 KaleidoscopeDoll 模组
}

// This block of code expands all declared replace properties in the specified resource targets.
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version      : getModProperty('minecraft_version', '1.21.1'),
            minecraft_version_range: getModProperty('minecraft_version_range', '[1.21.1]'),
            neo_version            : getModProperty('neo_version', '21.1.217'),
            loader_version_range   : getModProperty('loader_version_range', '[1,)'),
            mod_id                 : getModProperty('mod_id', 'player_doll'),
            mod_name               : getModProperty('mod_name', 'Player Doll'),
            mod_license            : getModProperty('mod_license', 'All Rights Reserved'),
            mod_version            : getModProperty('mod_version', '1.0.0'),
            mod_authors            : getModProperty('mod_authors', '蓝也（lan_ye）'),
            mod_description        : getModProperty('mod_description', 'Player Doll')
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    includeEmptyDirs = false
}

sourceSets.main.resources.srcDir "build/generated/sources/modMetadata"
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 确保所有资源处理任务使用 UTF-8 编码
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 配置 JAR 输出目录到指定的 mods 目录
def outputModsDir = file('F:/Repository/Software/Game/PCL/其他目录/测试专用目录/versions/玩家玩偶-neoForge-1.21.1/mods')

// 在项目评估后配置，确保 NeoForge 插件配置完成后再应用
afterEvaluate {
    // 获取项目属性（在 afterEvaluate 中可以安全访问）
    def archivesName = base.archivesName.get()
    def modVersion = version.toString()
    
    // 配置 jar 任务
    tasks.named('jar', Jar).configure {
        // 设置输出目录
        destinationDirectory.set(outputModsDir)
        
        // 确保输出目录存在
        doFirst {
            outputModsDir.mkdirs()
        }
        
        // 输出信息
        doLast {
            println "[PlayerDoll] JAR 文件已输出到: ${archiveFile.get().asFile.absolutePath}"
        }
    }
    
    // 如果存在 reobfJar 任务（NeoForge 重混淆任务），也配置其输出
    tasks.matching { it.name == 'reobfJar' }.configureEach {
        doLast {
            println "[PlayerDoll] 重混淆 JAR 文件位置: ${outputModsDir}/${archivesName}-${modVersion}.jar"
        }
    }
    
    // 配置 build 任务
    tasks.named('build').configure {
        doLast {
            def jarFile = new File(outputModsDir, "${archivesName}-${modVersion}.jar")
            if (jarFile.exists()) {
                println "[PlayerDoll] 构建完成，JAR 文件位置: ${jarFile.absolutePath}"
            }
        }
    }
}

// Modrinth 发布配置
modrinth {
    // 从环境变量或 gradle.properties 读取 token
    token = System.getenv("MODRINTH_TOKEN") ?: project.findProperty("modrinth_token")
    
    // 项目 ID（需要在 Modrinth 上创建项目后获取）
    // 访问 https://modrinth.com/mod/your-project-id 查看项目 ID
    projectId = project.findProperty("modrinth_project_id") ?: "your-project-id"
    
    // 版本号（从 gradle.properties 读取）
    versionNumber = "${mod_version}"
    
    // 版本类型：release（正式版）、beta（测试版）、alpha（开发版）
    versionType = project.findProperty("modrinth_version_type") ?: "release"
    
    // 上传的文件（构建的 JAR）
    uploadFile = jar
    
    // 游戏版本
    gameVersions = [getModProperty('minecraft_version', '1.21.1')]
    
    // 加载器（NeoForge 使用 "neoforge"）
    loaders = ["neoforge"]
    
    // 更新日志（支持 Markdown）
    // 可以从文件读取：changelog = file("CHANGELOG.md").text
    changelog = project.findProperty("modrinth_changelog") ?: """
        ## 🎉 首次发布 v1.0.0
        
        Player Doll Addon 的第一个正式版本！
        
        ### ✨ 核心功能
        - **默认玩偶**：提供 Steve（粗手臂）和 Alex（细手臂）的默认玩偶
        - **动态加载**：从游戏目录自动扫描并注册自定义皮肤材质玩偶
        - **右键放置**：使用玩偶物品右键方块可以在指定位置放置对应的玩偶实体
        - **姿态系统**：支持自定义静态姿势配置（如站立、坐下、趴下等）
        - **动作系统**：支持创建动态动画序列（如挥手、跳舞等），支持循环播放和关键帧插值
        - **模型类型**：支持粗手臂（Steve）和细手臂（Alex）两种模型类型
        
        ### 📁 自定义皮肤支持
        - 支持从 `player_doll/png/` 目录动态加载自定义皮肤
        - 自动识别文件名前缀（S/A）来确定模型类型
        - 支持热重载（F3+T 重新加载资源包）
        
        ### 🎮 配置系统
        - 支持通过 JSON 文件配置姿态和动作
        - 配置文件位于 `player_doll/poses/` 和 `player_doll/actions/` 目录
        - 提供默认的姿态和动作示例
        
        ### 📋 技术信息
        - **Minecraft 版本**: 1.21.1
        - **NeoForge 版本**: 21.1.217
        - **Java 版本**: 21
        
        ### 📖 使用说明
        详细的使用说明和配置教程请查看模组 README 文件。
        
        ---
        
        **作者**: 蓝也（lan_ye）
    """.stripIndent()
    
    // 可选：依赖关系
    // dependencies {
    //     required.project "fabric-api"
    //     optional.project "modmenu"
    // }
    
    // 同步项目描述到 Modrinth（从 README.md 读取）
    // 运行 ./gradlew modrinthSyncBody 来同步项目描述
    syncBodyFrom = file("README.md").text
}

